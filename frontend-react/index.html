    <!-- Theme anti-flash. Two independent preferences, matching ThemeContext:
         landing/login/register = Luxquant (default) or Dark, in `lq-theme-marketing`;
         in-app = Bright (default) or Dark, in `lq-theme`. -->
    <script>
      (function () {
        try {
          var path = (location.pathname || '/').replace(/\/+$/, '') || '/';
          var marketing = path === '/' || path === '/login' || path === '/register';
          var theme;
          if (marketing) {
            var m = localStorage.getItem('lq-theme-marketing');
            theme = m === 'dark' ? 'dark' : 'luxquant';
          } else {
            var t = localStorage.getItem('lq-theme');
            if (t === 'luxquant') t = 'bright';
            theme = t === 'dark' ? 'dark' : 'bright';
          }
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              'content',
              theme === 'bright' ? '#f5f6f8' : theme === 'dark' ? '#050506' : '#0a0506'
            );
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'luxquant';
        }
      })();
    </script>

    <!-- ════════════════════════════════════════════════
         INSTANT PRE-BOOT LOADER (zero-JS)
         Paints before the JS bundle loads so nobody sees a blank screen.
         It must stay a pixel match for the React <LoadingScreen> in
         src/components/ui/Loaders.jsx, because React swaps one for the other
         mid-load and any difference reads as a flicker. That file was moved
         to a bare spinner -- "no logo, no wordmark", branding on every load
         reads amateur -- and this block was left behind on the old emblem,
         so a cold load showed the retired design and then jumped. Change the
         two together or not at all.
         ════════════════════════════════════════════════ -->
    <style>
      #lq-preboot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0506;z-index:2147483000;}
      #lq-preboot .lqp-spin{position:relative;width:28px;height:28px;flex-shrink:0;}
      #lq-preboot .lqp-spin span{position:absolute;inset:0;border-radius:50%;box-sizing:border-box;}
      #lq-preboot .lqp-track{border:1.5px solid rgba(255,255,255,.08);}
      #lq-preboot .lqp-arc{border:1.5px solid transparent;border-top-color:rgba(255,255,255,.55);animation:lqp-spin .7s linear infinite;}
      @keyframes lqp-spin{to{transform:rotate(360deg);}}
    </style>
  </head>

      <!--prerender:start-->
      <div id="lq-preboot">
        <div class="lqp-spin">

        </div>
      </div>
      <!--prerender:end-->
