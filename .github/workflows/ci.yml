# CI — the checks that were only ever run when somebody remembered.
#
# Written after a change of mine broke two of the repo's own tests and shipped
# anyway: the suite exists, it is good, and nothing was running it. A test
# nobody runs is decoration.
#
# Three gates, matching what was being checked by hand:
#   · pytest must pass          (100 tests, fully mocked — no DB, Redis or network)
#   · eslint must have 0 ERRORS (warnings are allowed; ~95 are reviewed and
#                                deliberate, but rules-of-hooks is an error and
#                                catches a whole class of React bug)
#   · vite build must succeed   (a broken build cannot reach production)
name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

# A newer push makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # matches the production box
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile every module
        # pytest only imports what the tests reach. A file no test touches can
        # be unparseable and still go green — which is exactly how four sets of
        # merge conflict markers in notifications.py passed CI and took the
        # backend workers down with SyntaxError on boot.
        run: python -m compileall -q app

      - name: Guard against conflict markers
        # Cheap, and it would have caught the same incident one step earlier.
        run: |
          if grep -rn --include='*.py' -E '^(<<<<<<< |>>>>>>> )' app; then
            echo "::error::merge conflict markers committed"
            exit 1
          fi

      - name: Sync-DB-on-loop gate
        # An async def touching the DB synchronously blocks its worker's event
        # loop; under contention that murders the worker and every in-flight
        # request on it — 124 times in one day before it was found. This is the
        # regression this repo can never re-grow. Negative-tested: reintroducing
        # the async get_current_user fails the gate.
        run: python scripts/check_sync_db_on_loop.py

      - name: Run tests
        # The suite mocks every HTTP call and touches no database, so it needs
        # no services — see tests/test_journey_fetcher.py's "NO real network
        # call". If that stops being true, this job will say so loudly.
        run: python -m pytest tests/ -q

  frontend:
    name: frontend · lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"              # matches the production box
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (errors fail, warnings do not)
        # --max-warnings is deliberately not set. The warning count is real work
        # that was reviewed case by case; failing on it would push people to
        # silence warnings rather than read them. Errors are a different matter:
        # react-hooks/rules-of-hooks is configured as one, and it already caught
        # me placing hook calls below an early return.
        run: npx eslint src

      - name: Effect-deps TDZ scan
        # Catches the runtime crash class that shipped today: an effect deps
        # array referencing a const declared later in the file. Build and lint
        # are both blind to it; the negative test lives in the script header.
        run: node scripts/check-effect-deps-tdz.mjs src

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload dist (VPS rsyncs this — no vite on 2 cores)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-react/dist
          retention-days: 7
          if-no-files-found: error

  deploy-frontend:
    name: frontend · rsync artifact to VPS
    needs: frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Rsync to /var/www/luxquantdata
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # No literal host here on purpose: this repo is public, and the
          # origin sits behind Cloudflare. Publishing the origin IP lets
          # anyone bypass the CDN, the WAF and the rate limits entirely.
          if [ -z "${SSH_KEY:-}" ] || [ -z "${VPS_HOST:-}" ]; then
            echo "VPS_SSH_KEY/VPS_HOST not set — artifact is built, VPS not updated."
            echo "GitHub → Settings → Secrets: VPS_SSH_KEY, VPS_HOST, VPS_USER"
            exit 0
          fi
          : "${VPS_USER:=root}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Same rules as deploy.sh: rsync -a, no --delete, no purge_everything.
          rsync -az -e "ssh -4 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            dist/ "${VPS_USER}@${VPS_HOST}:/var/www/luxquantdata/"
          ssh -4 -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            'chown -R www-data:www-data /var/www/luxquantdata; /root/luxquant-terminal/scripts/cf-edge-health.sh || true'
